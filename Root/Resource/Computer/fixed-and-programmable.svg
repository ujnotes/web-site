  <title
     id="title">Fixed and programmable computers</title>
  <desc
     id="description">A beam balance has its procedure built into gears and levers. A Jacquard loom remains unchanged while punched-card instructions produce different woven patterns.</desc>
  <defs
     id="defs3">
    <pattern
       inkscape:collect="always"
       xlink:href="#clothA"
       id="pattern1"
       patternTransform="matrix(1.04,0,0,1.04,9.1693861,567.81758)"
       x="2.8"
       y="3"
       preserveAspectRatio="xMidYMid" />
    <marker
       id="arrow"
       viewBox="0 0 10 10"
       refX="9"
       refY="5"
       markerWidth="8"
       markerHeight="8"
       orient="auto">
      <path
         d="M0 0 10 5 0 10Z"
         class="ink-fill"
         id="path1" />
    </marker>
    <pattern
       id="clothA"
       width="14"
       height="14"
       patternUnits="userSpaceOnUse"
       patternTransform="translate(-3.5,-3.5)"
       inkscape:label="clothA">
      <rect
         width="14"
         height="14"
         fill="#f4cf78"
         id="rect1" />
      <path
         d="M0 7h14M7 0v14"
         stroke="#b64942"
         stroke-width="4"
         id="path2" />
    </pattern>
