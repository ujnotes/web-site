<?xml version="1.0" encoding="UTF-8"?>
<svg aria-labelledby="title description" role="img" version="1.1" viewBox="0 0 900 410" xmlns="http://www.w3.org/2000/svg" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
	<title id="title">Fixed and programmable computers</title>
	<desc id="description">A beam balance has its procedure built into gears and levers. A Jacquard loom remains unchanged while punched-card instructions produce different woven patterns.</desc>
	<defs>
		<marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="9" refY="5" viewBox="0 0 10 10">
			<path d="m0 0 10 5-10 5z" fill="#172033"/>
		</marker>
		<pattern id="clothA" width="14" height="14" patternUnits="userSpaceOnUse">
			<rect width="14" height="14" fill="#f4cf78"/>
			<path d="M0 7h14M7 0v14" stroke="#b64942" stroke-width="4"/>
		</pattern>
		<pattern id="clothB" width="16" height="16" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
			<rect width="16" height="16" fill="#377887"/>
			<path d="M0 4h16M0 12h16" stroke="#d8eee7" stroke-width="4"/>
		</pattern>
		<filter id="softShadow" x="-.0625" y="-.012739" width="1.125" height="1.0413">
			<feDropShadow dx="0" dy="3" flood-color="#172033" flood-opacity=".16" stdDeviation="3"/>
		</filter>
		<style>.panel { fill: #f7fbff; stroke: #172033; stroke-width: 4; }
      .machine { fill: #d9ecff; stroke: #172033; stroke-width: 5; stroke-linejoin: round; }
      .card { fill: #fff3bf; stroke: #172033; stroke-width: 4; }
      .line { fill: none; stroke: #172033; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .label { fill: #172033; font: 700 25px system-ui, sans-serif; text-anchor: middle; }
      .note { fill: #465166; font: 18px system-ui, sans-serif; text-anchor: middle; }
      .hole { fill: #172033; }
      .wood { fill: #a95f3b; stroke: #172033; stroke-width: 4; stroke-linejoin: round; }
      .metal { fill: #bfccd2; stroke: #172033; stroke-width: 4; stroke-linejoin: round; }
      .brass { fill: #d9a13d; stroke: #172033; stroke-width: 3; }
      .thread { fill: none; stroke: #738994; stroke-width: 1.4; }
      .detail { fill: none; stroke: #465166; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .tiny { fill: #465166; font: 700 10px system-ui, sans-serif; letter-spacing: 1px; text-anchor: middle; }
      .cloth-a { fill: url(#clothA); stroke: #172033; stroke-width: 3; }
      .cloth-b { fill: url(#clothB); stroke: #172033; stroke-width: 3; }</style>
	</defs>
	<rect class="panel" x="22" y="25" width="410" height="350" rx="20"/>
	<rect class="panel" x="468" y="25" width="410" height="350" rx="20"/>
	<text class="label" x="227" y="66">Fixed computer</text>
	<text class="label" x="673" y="66">Programmable computer</text>
	<!-- A fixed-purpose beam balance: procedure embodied in structure -->
	<g filter="url(#softShadow)">
		<path class="wood" d="M76 270h302l-15 32H91Z"/>
		<path class="metal" d="m205 143h44l15 127h-74z"/>
		<path class="detail" d="m227 108.85v34.14"/>
		<path d="m79 142h298" stroke="#172033" stroke-linecap="round" stroke-width="9"/>
		<path class="detail" d="m103 148v66m250-66v66"/>
		<path class="metal" d="m69 214h68l-9 14h-50zm250 0h68l-9 14h-50z"/>
		<path class="detail" d="m79 211q24-41 48 0m202 0q24-41 48 0"/>
		<rect x="91" y="181" width="25" height="30" rx="3" fill="#688c98" stroke="#172033" stroke-width="3"/>
		<rect x="340" y="171" width="28" height="40" rx="3" fill="#688c98" stroke="#172033" stroke-width="3"/>
		<!-- The former circle is now a toothed gear -->
		<g transform="translate(227 211)" filter="url(#softShadow)">
			<g class="brass">
				<circle r="12" fill="#fff8e5"/>
			</g>
			<path d="m-0.43764-40.43 0.26043 40.214" opacity=".55" stroke="#8e5925" stroke-width="5"/>
		</g>
		<path class="brass" d="m215 113 12-15 12 15-12 13z"/>
	</g>
	<text class="tiny" x="227" y="322">MECHANISM = PROCEDURE</text>
	<text class="note" x="227" y="351" font-family="system-ui, sans-serif" font-size="18px" style="line-height:normal">change the task → rebuild the machine</text>
	<!-- Articulated punched-card program -->
	<g transform="rotate(-5 1681.9 -5411)" filter="url(#softShadow)">
		<path class="card" d="m0 0h91v49h-91zm5 54h91v49h-91zm5 54h91v49h-91z"/>
		<g class="hole">
			<circle cx="16" cy="14" r="4"/>
			<circle cx="45" cy="14" r="4"/>
			<circle cx="74" cy="14" r="4"/>
			<circle cx="30" cy="34" r="4"/>
			<circle cx="74" cy="34" r="4"/>
			<circle cx="21" cy="69" r="4"/>
			<circle cx="50" cy="69" r="4"/>
			<circle cx="79" cy="69" r="4"/>
			<circle cx="21" cy="89" r="4"/>
			<circle cx="64" cy="89" r="4"/>
			<circle cx="26" cy="123" r="4"/>
			<circle cx="55" cy="123" r="4"/>
			<circle cx="84" cy="123" r="4"/>
			<circle cx="41" cy="143" r="4"/>
			<circle cx="84" cy="143" r="4"/>
		</g>
	</g>
	<!-- Detailed Jacquard loom, unchanged while cards and patterns vary -->
	<g transform="translate(-11.487)" filter="url(#softShadow)">
		<path class="wood" d="m619 100h171v205h-171z"/>
		<path d="m634 116h141v174h-141z" fill="#fff9e9" stroke="#172033" stroke-width="4"/>
		<path class="wood" d="m615 143h179v18h-179zm0 132h179v18h-179z"/>
		<g class="thread">
			<path d="m644 160v111m8-111v111m8-111v111m8-111v111m8-111v111m8-111v111m8-111v111m8-111v111m8-111v111m8-111v111m8-111v111m8-111v111m8-111v111m8-111v111m8-111v111m8-111v111"/>
		</g>
		<path d="m638 207h133" stroke="#172033" stroke-width="8"/>
		<path class="cloth-a" d="m644 212h120v48h-120z"/>
		<path class="cloth-b" d="m644 260h120v30h-120z"/>
		<path d="m641 184h127" stroke="#d19b42" stroke-width="4"/>
		<path d="m658 175h91l22 9-22 9h-91l-20-9z" fill="#bd6242" stroke="#172033" stroke-width="3"/>
		<g class="brass" transform="matrix(.43 0 0 .43 767.71 122.04)">
			<rect x="-7" y="-45" width="14" height="18"/>
			<rect transform="rotate(45)" x="-7" y="-45" width="14" height="18"/>
			<rect transform="rotate(90)" x="-7" y="-45" width="14" height="18"/>
			<rect transform="rotate(135)" x="-7" y="-45" width="14" height="18"/>
			<rect transform="scale(-1)" x="-7" y="-45" width="14" height="18"/>
			<rect transform="rotate(225)" x="-7" y="-45" width="14" height="18"/>
			<rect transform="rotate(-90)" x="-7" y="-45" width="14" height="18"/>
			<rect transform="rotate(-45)" x="-7" y="-45" width="14" height="18"/>
			<circle r="32"/>
			<circle r="10" fill="#fff8e5"/>
		</g>
	</g>
	<!-- The same loom yields visibly different fabrics -->
	<g transform="translate(806 171)">
		<path class="cloth-a" d="M0 0h49v49H0Z"/>
		<path class="cloth-b" d="M0 61h49v49H0Z"/>
	</g>
	<g font-family="system-ui, sans-serif" font-size="10px" font-weight="700">
		<text class="tiny" x="534" y="112" style="line-height:normal">PUNCHED CARDS</text>
		<text class="tiny" x="830.81842" y="304" style="line-height:normal">NEW PATTERNS</text>
		<text class="tiny" x="673" y="322" style="line-height:normal">SAME LOOM – NEW INSTRUCTIONS</text>
	</g>
	<text class="note" x="673" y="351">change cards → change the result</text>
	<metadata>
		<rdf:RDF>
			<cc:Work rdf:about="">
				<dc:title>Fixed and programmable computers</dc:title>
			</cc:Work>
		</rdf:RDF>
	</metadata>
</svg>
