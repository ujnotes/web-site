<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" role="img" aria-labelledby="title description">
  <title id="title">Fixed and programmable computers</title>
  <desc id="description">A fixed computer changes task only when its mechanism is rebuilt. A programmable computer changes task when its instructions are changed.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#172033"/>
    </marker>
    <style>
      .panel { fill: #f7fbff; stroke: #172033; stroke-width: 4; }
      .machine { fill: #d9ecff; stroke: #172033; stroke-width: 5; stroke-linejoin: round; }
      .card { fill: #fff3bf; stroke: #172033; stroke-width: 4; }
      .line { fill: none; stroke: #172033; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .label { fill: #172033; font: 700 25px system-ui, sans-serif; text-anchor: middle; }
      .note { fill: #465166; font: 18px system-ui, sans-serif; text-anchor: middle; }
      .hole { fill: #172033; }
    </style>
  </defs>
  <rect class="panel" x="22" y="25" width="410" height="350" rx="20"/>
  <rect class="panel" x="468" y="25" width="410" height="350" rx="20"/>
  <text class="label" x="227" y="66">Fixed computer</text>
  <text class="label" x="673" y="66">Programmable computer</text>
  <path class="machine" d="M129 134h196v132H129Z"/>
  <circle class="machine" cx="185" cy="200" r="34"/>
  <path class="machine" d="M246 169h48v62h-48Z"/>
  <path class="line" d="M227 292v30"/>
  <text class="note" x="227" y="351">rebuild the mechanism</text>
  <rect class="card" x="501" y="118" width="112" height="156" rx="8"/>
  <circle class="hole" cx="530" cy="151" r="7"/><circle class="hole" cx="562" cy="151" r="7"/><circle class="hole" cx="584" cy="184" r="7"/>
  <circle class="hole" cx="530" cy="217" r="7"/><circle class="hole" cx="562" cy="250" r="7"/>
  <path class="line" d="M626 196h42"/>
  <path class="machine" d="M685 134h160v132H685Z"/>
  <circle class="machine" cx="733" cy="200" r="30"/>
  <path class="machine" d="M785 171h35v58h-35Z"/>
  <path class="line" d="M673 292v30"/>
  <text class="note" x="673" y="351">replace the instructions</text>
</svg>
