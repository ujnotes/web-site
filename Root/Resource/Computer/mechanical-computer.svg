  <circle class="accent" cx="360" cy="214" r="27"/>
  <path class="soft" d="M322 310h76l-24-69h-28Z"/>
  <path class="line" d="M274 310h172"/>
  <path class="line" d="M132 186v48m456-48v48"/>
  <path class="soft" d="M84 234h96l-14 42H98Z"/>
  <path class="soft" d="M540 234h96l-14 42h-68Z"/>
  <rect class="accent" x="111" y="202" width="42" height="32" rx="5"/>
  <rect class="accent" x="560" y="190" width="56" height="44" rx="5"/>
  <text class="small" x="132" y="334">input</text>
  <text class="small" x="360" y="334">compare</text>
  <text class="small" x="588" y="334">input</text>
</svg>
