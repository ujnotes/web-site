<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title description">
  <title id="title">A beam balance as a mechanical computer</title>
  <desc id="description">Two weights act as inputs. The beam and pivot compare them, and the beam angle is the output.</desc>
  <defs>
    <style>
      .line { fill: none; stroke: #172033; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .soft { fill: #d9ecff; stroke: #172033; stroke-width: 5; stroke-linejoin: round; }
      .accent { fill: #5aa9e6; stroke: #172033; stroke-width: 5; stroke-linejoin: round; }
      .label { fill: #172033; font: 600 22px system-ui, sans-serif; text-anchor: middle; }
      .small { fill: #465166; font: 18px system-ui, sans-serif; text-anchor: middle; }
    </style>
  </defs>
  <text class="label" x="360" y="34">Mechanical comparison</text>
