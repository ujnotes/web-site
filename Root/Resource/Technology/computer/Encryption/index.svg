<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" id="caesar-cover" role="img" aria-labelledby="title desc"><title id="title">Caesar cipher: shift each letter by three</title><desc id="desc">A maps to D, B to E and C to F. HELLO becomes KHOOR.</desc><style>:root{color-scheme:light dark;--bg:#edf3f8;--ink:#40516f;--note:#60728a;--panel:#ffffff;--accent:#287c74;--arrow:#8196ac}@media(prefers-color-scheme:dark){:root{--bg:#172233;--ink:#d8e4f0;--note:#adbed1;--panel:#233247;--accent:#8fd3c7;--arrow:#8ca5c0}}</style><rect width="1200" height="675" fill="var(--bg)"/><g font-family="system-ui,sans-serif" fill="var(--ink)"><text x="70" y="92" font-size="32" letter-spacing="5">CAESAR CIPHER</text><text x="70" y="138" font-size="22" fill="var(--note)">A simple letter-substitution example</text><rect x="60" y="190" width="1080" height="174" rx="20" fill="var(--panel)"/><g font-family="Consolas,monospace" font-size="28" font-weight="700" text-anchor="middle"><text x="80" y="250" fill="var(--ink)">A</text><text x="120" y="250" fill="var(--ink)">B</text><text x="160" y="250" fill="var(--ink)">C</text><text x="200" y="250" fill="var(--ink)">D</text><text x="240" y="250" fill="var(--ink)">E</text><text x="280" y="250" fill="var(--ink)">F</text><text x="320" y="250" fill="var(--ink)">G</text><text x="360" y="250" fill="var(--ink)">H</text><text x="400" y="250" fill="var(--ink)">I</text><text x="440" y="250" fill="var(--ink)">J</text><text x="480" y="250" fill="var(--ink)">K</text><text x="520" y="250" fill="var(--ink)">L</text><text x="560" y="250" fill="var(--ink)">M</text><text x="600" y="250" fill="var(--ink)">N</text><text x="640" y="250" fill="var(--ink)">O</text><text x="680" y="250" fill="var(--ink)">P</text><text x="720" y="250" fill="var(--ink)">Q</text><text x="760" y="250" fill="var(--ink)">R</text><text x="800" y="250" fill="var(--ink)">S</text><text x="840" y="250" fill="var(--ink)">T</text><text x="880" y="250" fill="var(--ink)">U</text><text x="920" y="250" fill="var(--ink)">V</text><text x="960" y="250" fill="var(--ink)">W</text><text x="1000" y="250" fill="var(--ink)">X</text><text x="1040" y="250" fill="var(--ink)">Y</text><text x="1080" y="250" fill="var(--ink)">Z</text><text x="80" y="320" fill="var(--accent)">D</text><text x="120" y="320" fill="var(--accent)">E</text><text x="160" y="320" fill="var(--accent)">F</text><text x="200" y="320" fill="var(--accent)">G</text><text x="240" y="320" fill="var(--accent)">H</text><text x="280" y="320" fill="var(--accent)">I</text><text x="320" y="320" fill="var(--accent)">J</text><text x="360" y="320" fill="var(--accent)">K</text><text x="400" y="320" fill="var(--accent)">L</text><text x="440" y="320" fill="var(--accent)">M</text><text x="480" y="320" fill="var(--accent)">N</text><text x="520" y="320" fill="var(--accent)">O</text><text x="560" y="320" fill="var(--accent)">P</text><text x="600" y="320" fill="var(--accent)">Q</text><text x="640" y="320" fill="var(--accent)">R</text><text x="680" y="320" fill="var(--accent)">S</text><text x="720" y="320" fill="var(--accent)">T</text><text x="760" y="320" fill="var(--accent)">U</text><text x="800" y="320" fill="var(--accent)">V</text><text x="840" y="320" fill="var(--accent)">W</text><text x="880" y="320" fill="var(--accent)">X</text><text x="920" y="320" fill="var(--accent)">Y</text><text x="960" y="320" fill="var(--accent)">Z</text><text x="1000" y="320" fill="var(--accent)">A</text><text x="1040" y="320" fill="var(--accent)">B</text><text x="1080" y="320" fill="var(--accent)">C</text></g><path d="M78 268v24m-7-8 7 8 7-8M118 268v24m-7-8 7 8 7-8M158 268v24m-7-8 7 8 7-8" fill="none" stroke="var(--arrow)" stroke-width="2"/><text x="70" y="423" font-size="22" fill="var(--note)">SHIFT +3</text><g font-family="Consolas,monospace" font-size="74" font-weight="700" letter-spacing="10"><text x="70" y="530">HELLO</text><text x="700" y="530" fill="var(--accent)">KHOOR</text></g><path d="M470 504h143m-22-17 22 17-22 17" fill="none" stroke="var(--arrow)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="611" font-size="20" fill="var(--note)">Each letter moves three places forward. After Z, wrap around to A.</text></g></svg>
