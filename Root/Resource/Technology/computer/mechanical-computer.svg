		<text class="small" x="360" y="334" style="line-height:normal">comparator</text>
		<text class="small" x="588" y="128" style="line-height:normal">input</text>
	</g>
	<metadata>
		<rdf:RDF>
			<cc:Work rdf:about="">
				<dc:title>A beam balance as a mechanical computer</dc:title>
			</cc:Work>
		</rdf:RDF>
	</metadata>
	<g font-family="system-ui, sans-serif" font-size="18px">
		<text class="small" x="132" y="92.585365" style="line-height:normal">A</text>
		<text class="small" x="588" y="86.585365" style="line-height:normal">B</text>
		<text class="small" x="360" y="171.46332" style="line-height:normal">output</text>
	</g>
