<?xml version="1.0" encoding="UTF-8"?>
<svg aria-labelledby="title description" role="img" version="1.1" viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
	<title id="title">A beam balance as a mechanical computer</title>
	<desc id="description">Two weights act as inputs. The beam and pivot compare them, and the beam angle is the output.</desc>
	<defs>
		<style>
			:root { color-scheme: light dark; }
			.line { fill: none; stroke: var(--ink); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
			.soft { fill: var(--fill); stroke: var(--ink); stroke-width: 5; stroke-linejoin: round; }
			.accent { fill: var(--accent); stroke: var(--ink); stroke-width: 5; stroke-linejoin: round; }
			.label { fill: var(--ink); font: 600 22px system-ui, sans-serif; text-anchor: middle; }
			.small { fill: var(--note); font: 18px system-ui, sans-serif; text-anchor: middle; }
			.formula { fill: var(--accent); font: italic 16.344px Georgia, 'Times New Roman', serif; }
			.chevron { fill: var(--chevron); stroke: var(--ink); stroke-width: .081177; }
			:root {
				--ink: #40516f;
				--note: #465166;
				--fill: #d9ecff;
				--accent: #5aa9e6;
				--chevron: #69b7cf;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--ink: #d8e4f0;
					--note: #9aabbe;
					--fill: #243044;
					--accent: #5aa9e6;
					--chevron: #69b7cf;
				}
			}
		</style>
	</defs>
	<text class="label" x="360" y="34">Mechanical comparison</text>
