  <title
     id="title">नियत और प्रोग्राम योग्य कंप्यूटर</title>
  <desc
     id="description">दंड तुला की प्रक्रिया उसके गियर और लीवर में बनी होती है। जैक्वार्ड करघा वही रहता है, जबकि छिद्रित कार्ड अलग-अलग बुने पैटर्न बनाते हैं।</desc>
