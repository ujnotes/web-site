         flood-opacity=".16" />
    </filter>
    <style
       id="style3">
      :root { color-scheme: light dark; }
      .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 4; }
      .machine { fill: var(--fill); stroke: var(--ink); stroke-width: 5; stroke-linejoin: round; }
      .card { fill: var(--card); stroke: var(--ink); stroke-width: 4; }
      .line { fill: none; stroke: var(--ink); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .label { fill: var(--ink); font: 700 22px system-ui, 'Nirmala UI', 'Noto Sans Devanagari', sans-serif; text-anchor: middle; }
      .note { fill: var(--note); font: 18px system-ui, 'Nirmala UI', 'Noto Sans Devanagari', sans-serif; text-anchor: middle; }
      .hole { fill: var(--ink); }
      .wood { fill: var(--wood); stroke: var(--ink); stroke-width: 4; stroke-linejoin: round; }
      .metal { fill: var(--metal); stroke: var(--ink); stroke-width: 4; stroke-linejoin: round; }
      .brass { fill: var(--brass); stroke: var(--ink); stroke-width: 3; }
      .thread { fill: none; stroke: var(--thread); stroke-width: 1.4; }
      .detail { fill: none; stroke: var(--note); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .tiny { fill: var(--note); font: 700 11px system-ui, 'Nirmala UI', 'Noto Sans Devanagari', sans-serif; letter-spacing: 0; text-anchor: middle; }
      .cloth-a { fill: url(#clothA); stroke: var(--ink); stroke-width: 3; }
      .cloth-b { fill: url(#clothB); stroke: var(--ink); stroke-width: 3; }
      .weight { fill: var(--weight); stroke: var(--ink); stroke-width: 3; }
      .loom-face { fill: var(--loom-face); stroke: var(--ink); stroke-width: 4; }
      .beam { stroke: var(--ink); stroke-linecap: round; stroke-width: 9; fill: none; }
      .shuttle { fill: var(--shuttle); stroke: var(--ink); stroke-width: 3; }
      .hub { fill: var(--hub); }
      .spoke { opacity: .55; stroke: var(--spoke); stroke-width: 5; fill: none; }
      .gold-line { stroke: var(--brass); stroke-width: 4; fill: none; }
      .heddle { stroke: var(--ink); stroke-width: 8; fill: none; }
      .ink-fill { fill: var(--ink); }
      :root {
        --ink: #172033;
        --note: #465166;
        --panel: #f7fbff;
        --fill: #d9ecff;
        --card: #fff3bf;
        --wood: #a95f3b;
        --metal: #bfccd2;
        --brass: #d9a13d;
        --thread: #738994;
        --weight: #688c98;
        --loom-face: #fff9e9;
        --shuttle: #bd6242;
        --hub: #fff8e5;
        --spoke: #8e5925;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #d8e4f0;
          --note: #9aabbe;
          --panel: #1e2438;
          --fill: #243044;
          --card: #3d3420;
          --wood: #8a4e32;
          --metal: #6a7a84;
          --brass: #e0b056;
          --thread: #8aa0b0;
          --weight: #7ea0ac;
          --loom-face: #2a3148;
          --shuttle: #c56e4e;
          --hub: #3a3424;
          --spoke: #e0b056;
        }
        #clothA rect { fill: #c9a65a; }
        #clothA path { stroke: #e07a72; }
        #clothB rect { fill: #4a9aaa; }
        #clothB path { stroke: #cfeee6; }
      }
    </style>
