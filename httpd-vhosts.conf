<VirtualHost *:80>
    ServerAdmin webmaster_local@ujnotes.com
    DocumentRoot /var/www/root
    ServerName ujnotes.local
    ServerAlias ujnotes.local
    <Directory />
      Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/ujnotes.local-error.log
    CustomLog ${APACHE_LOG_DIR}/ujnotes.local-access.log common
</VirtualHost>

